          description: Internal server error

    post:
      summary: Create new travel
      description: Create a new travel and return HTML response
      operationId: create_travel
      tags:
        - travels
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the travel
                description:
                  type: string
                  description: Description of the travel
                user_ids:
                  type: array
                  items:
                    type: integer
                  description: List of user IDs
                entertainment_ids:
                  type: array
                  items:
                    type: integer
                  description: List of entertainment IDs
                accommodation_ids:
                  type: array
                  items:
                    type: integer
                  description: List of accommodation IDs
      responses:
        '201':
          description: Travel created successfully
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Bad request

  /api/v1/travels/{travel_id}:
    put:
      summary: Update travel
      description: Update an existing travel and return HTML response
      operationId: update_travel
      tags:
        - travels
      parameters:
        - name: travel_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                status:
                  type: string
