        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                city_id:
                  type: integer
                event_time:
                  type: string
                  format: date-time
                address:
                  type: string
                cost:
                  type: number
                description:
                  type: string
      responses:
        '201':
          description: Entertainment updated successfully
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Entertainment not found
        '500':
          description: Internal server error

    patch:
      summary: Partial update entertainment time
      description: Update only the event time of an entertainment
      operationId: update_entertainment_dates
      tags:
        - entertainments
      parameters:
        - name: entertainment_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                event_time:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Entertainment time updated successfully
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Entertainment not found
        '500':
          description: Internal server error

    delete:
      summary: Delete entertainment
      description: Delete an entertainment and redirect to entertainments page
      operationId: delete_entertainment
      tags:
        - entertainments
      parameters:
        - name: entertainment_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '404':
          description: Entertainment not found
        '500':
          description: Internal server error

  /api/v1/route/{route_id}/entertainments/{entertainment_id}:
    delete:
      summary: Delete entertainment from route
      description: Delete an entertainment from a specific route and redirect to route edit page
      operationId: delete_entertainment_for_route
      tags:
        - route-entertainments
      parameters:
        - name: entertainment_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: route_id
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '404':
          description: Entertainment or route not found
        '500':
          description: Internal server error

    post:
      summary: Add entertainment to route
      description: Create a new entertainment and add it to a specific route
      operationId: add_ent_to_route
      tags:
        - route-entertainments
      parameters:
        - name: route_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                city_id:
                  type: integer
                event_time:
                  type: string
                  format: date-time
                address:
                  type: string
                cost:
                  type: number
                description:
                  type: string
      responses:
        '400':
          description: Bad request
        '404':
          description: Route not found
        '500':
          description: Internal server error

# ==================== СПРАВОЧНИК МАРШРУТОВ ====================
  /api/v1/directory_routes:
    get:
      summary: Get all directory routes
      description: Retrieve all directory routes and render HTML page
      operationId: get_all_d_routes
      tags:
        - directory-routes
      responses:
        '201':
          description: HTML page with directory routes
          content:
            text/html:
              schema:
                type: string
        '500':
          description: Internal server error

    post:
      summary: Create new directory route
      description: Create a new directory route and return HTML response
      operationId: create_d_route
      tags:
        - directory-routes
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - type_transport
                - cost
                - distance
                - departure_city_id
                - destination_city_id
              properties:
                type_transport:
                  type: string
                  description: Type of transport
                  example: "train"
                cost:
                  type: integer
                  minimum: 0
                  description: Cost of the route
                  example: 1500
                distance:
                  type: integer
                  minimum: 1
                  description: Distance in kilometers
                  example: 300
                departure_city_id:
                  type: integer
                  minimum: 1
                  description: ID of departure city
                destination_city_id:
                  type: integer
                  minimum: 1
                  description: ID of destination city
      responses:
        '201':
          description: Directory route created successfully
          content:
            text/html:
              schema:
                type: string
        '400':
          description: Bad request

  /api/v1/directory_routes/{d_route_id}:
    get:
      summary: Get directory route details
      description: Retrieve detailed information about a specific directory route
      operationId: get_d_route
      tags:
        - directory-routes
      parameters:
        - name: d_route_id
          in: path
          required: true
          description: ID of the directory route
          schema:
            type: integer
            minimum: 1
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  d_route_id:
                    type: integer
                    example: 1
                  type_transport:
                    type: string
                    example: "train"
                  cost:
                    type: integer
                    example: 1500
                  distance:
                    type: integer
                    example: 300
                  departure_city:
                    type: object
                    properties:
                      city_id:
                        type: integer
                      name:
                        type: string
                      # Другие поля города
                  destination_city:
                    type: object
                    properties:
                      city_id:
                        type: integer
                      name:
                        type: string
                      # Другие поля города
        '404':
          description: Directory route not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Directory route not found"
        '500':
          description: Internal server error

    put:
      summary: Update directory route
      description: Update an existing directory route and return HTML response
      operationId: update_d_route
      tags:
        - directory-routes
      parameters:
        - name: d_route_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                type_transport:
                  type: string
                  description: Type of transport
                  example: "bus"
                cost:
                  type: integer
                  minimum: 0
                  description: Cost of the route
                  example: 1201
                distance:
                  type: integer
                  minimum: 1
                  description: Distance in kilometers
                  example: 250
                departure_city_id:
                  type: integer
                  minimum: 1
                  description: ID of departure city
                destination_city_id:
                  type: integer
                  minimum: 1
                  description: ID of destination city
      responses:
        '201':
          description: Directory route updated successfully
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Directory route not found
        '500':
          description: Internal server error

    delete:
      summary: Delete directory route
      description: Delete a directory route and redirect to directory routes page
      operationId: delete_d_route
      tags:
        - directory-routes
      parameters:
        - name: d_route_id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '404':
          description: Directory route not found
        '500':
          description: Internal server error

# ==================== ПУТЕШЕСТВИЕ ====================
  /api/v1/travels:
    get:
      summary: Get all travels
