                user_ids:
                  type: array
                  items:
                    type: integer
                entertainment_ids:
                  type: array
                  items:
                    type: integer
                accommodation_ids:
                  type: array
                  items:
                    type: integer
      responses:
        '201':
          description: Travel updated successfully
          content:
            text/html:
              schema:
                type: string
