services:
  loki:
    image: grafana/loki:2.9.0
    container_name: travelguide-loki
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - ./monitoring/data/index:/loki/index
      - ./monitoring/data/chunks:/loki/chunks
      - ./monitoring/data/cache:/loki/cache
      - ./monitoring/data/wal:/loki/wal 
      - ./monitoring/data/compactor:/loki/compactor 
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    networks:
      - web_my_network  

  promtail:
    image: grafana/promtail:2.9.0
    container_name: travelguide-promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml
      - ./logs:/var/log/app  # Твои файлы логов приложения
      - /var/log:/var/log/host
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - web_my_network

  grafana:
    image: grafana/grafana:10.3.1
    container_name: travelguide-grafana
    volumes:
      - ./monitoring/grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_ROOT_URL=http://localhost/monitoring
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    ports:
      - "3000:3000"
    depends_on:
      - loki
    networks:
      - web_my_network

networks:
  web_my_network:
    driver: bridge
