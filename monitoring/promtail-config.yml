server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: travelguide_logs
    static_configs:
      # Core Service logs
      - targets:
          - localhost
        labels:
          job: travelguide
          service: core_service
          environment: production
          __path__: /var/log/app/core_service/**/*.log

      # Data Service logs  
      - targets:
          - localhost
        labels:
          job: travelguide
          service: data_service
          environment: production
          __path__: /var/log/app/data_service/**/*.log

      # Gateway logs
      - targets:
          - localhost
        labels:
          job: travelguide
          service: gateway
          environment: production
          __path__: /var/log/app/gateway/**/*.log