server {
    listen 80;
    server_name localhost;
    more_clear_headers Server;
    more_set_headers "Server: TravelGuide-App";

    location = /openapi/v1.json {
        proxy_pass http://app_main:8010/openapi/v1.json;
        proxy_set_header Host $host;
    }

    location = /openapi/v2.json {
        proxy_pass http://app_main:8010/openapi/v2.json;
        proxy_set_header Host $host;
    }
    # --------------------------------
    # Swagger документация
    # --------------------------------
    # Ставим раньше API, иначе перекрывается
    location = /api/v1/docs {
        proxy_pass http://app_main:8010/api/v1/docs;
        proxy_set_header Host $host;
    }

    location /api/v1/docs/ {
        proxy_pass http://app_main:8010/api/v1/docs/;
        proxy_set_header Host $host;
    }

    location = /api/v2/docs {
        proxy_pass http://app_main:8010/api/v2/docs;
        proxy_set_header Host $host;
    }

    location /api/v2/docs/ {
        proxy_pass http://app_main:8010/api/v2/docs/;
        proxy_set_header Host $host;
    }

    # --------------------------------
    # API v1 — читаем и пишем с балансировкой
    # --------------------------------
    location /api/v1/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Все, кроме GET → только write-сервер
        limit_except GET {
            proxy_pass http://backend_write;
        }

        # GET → балансировка 2:1:1
        proxy_pass http://backend_get;
    }

    # --------------------------------
    # API v2 — аналогично
    # --------------------------------
    location /api/v2/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_except GET {
            proxy_pass http://backend_write;
        }

        proxy_pass http://backend_get;
    }

    # --------------------------------
    # Legacy MPA / SPA
    # --------------------------------
    location /legacy {
        proxy_pass http://app_main:8010/;
    }

    # --------------------------------
    # Документация (README.md)
    # --------------------------------
    location /documentation {
        alias /var/www/docs;
        index index.html;
    }

    location /docs/README.md {
        alias /var/www/docs/README.md;
    }

    location /documentation/img/ {
        alias /var/www/docs/img/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /reserved/ {
        alias /var/www/static/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
   
     # --------------------------------
    # Зеркальная версия приложения /mirror
    # --------------------------------
    location /mirror/ {
        proxy_pass http://app_main:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Переписываем HTML/JS/CSS пути для SPA
        sub_filter_types text/html text/css application/javascript;
        sub_filter 'href="/' 'href="/mirror/';
        sub_filter 'src="/' 'src="/mirror/';
        sub_filter 'action="/' 'action="/mirror/';
        sub_filter_once off;

        try_files $uri /index.html;
    }

    location /mirror/api/v1/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_except GET {
            proxy_pass http://backend_write;
        }
        proxy_pass http://backend_get;
    }

    location /mirror/api/v2/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_except GET {
            proxy_pass http://backend_write;
        }
        proxy_pass http://backend_get;
    }

    location /mirror/api/v1/docs {
        proxy_pass http://app_main:8010/api/v1/docs;
    }
    location /mirror/api/v2/docs {
        proxy_pass http://app_main:8010/api/v2/docs;
    }

    location /mirror/openapi/v1.json {
        proxy_pass http://app_main:8010/openapi/v1.json;
    }
    location /mirror/openapi/v2.json {
        proxy_pass http://app_main:8010/openapi/v2.json;
    }
     # --------------------------------
    # Admin (pgAdmin4)
    # --------------------------------
    location /admin/ {
        proxy_pass http://travelguide-pgadmin:80;
        proxy_redirect / /admin/;
        proxy_cookie_path / /admin/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /admin;
        
        # Переписываем HTML для корректных путей
        sub_filter_once off;
        sub_filter_types *;
        sub_filter 'href="/' 'href="/admin/';
        sub_filter 'src="/' 'src="/admin/';
        sub_filter 'action="/' 'action="/admin/';
        sub_filter "href='/" "href='/admin/";
        sub_filter "src='/" "src='/admin/";
    }

    # --------------------------------
    # Management
    # --------------------------------
    location /management/ {
        alias /var/www/management/;
        index index.html;
    }

    location /monitoring/ {
        proxy_pass http://travelguide-grafana:3000; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------
    # Health и status
    # --------------------------------
    location /health {
        proxy_pass http://app_main:8010/api/v2/health;
    }

    location /status {
        stub_status on;
        access_log off;
        allow all;
    }

    location / {
        alias /var/www/static/;
        index index.html;
        if ($request_uri ~* "^/api/") {
            set $no_cache 1;
        }
        expires 10m;
        add_header Cache-Control "public";
        add_header X-Cache-Status "STATIC" always;

        try_files $uri $uri/ /index.html =404;
    }
}
