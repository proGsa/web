server {
    listen 80;
    server_name localhost;
    # API v1
    location ^~ /api/v1/accommodations {
        proxy_pass http://web-app-1:8010/api/v1/accommodations;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # Полностью отключаем обработку редиректов
        proxy_redirect off;
        
        # Явно указываем Content-Type
        proxy_hide_header Content-Type;
        add_header Content-Type "text/html; charset=utf-8" always;
    }


    location ^~ /api/v2/ {
        proxy_pass http://web-app-1:8010/api/v2/;  # ← Добавить /api/v2/ в конец!
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /static-img/ {
        alias /var/www/static/img/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Legacy MPA система - ОДИН блок!
    location /legacy {
        proxy_pass http://web-app-1:8010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger документация
    location /api/v1/docs {
        proxy_pass http://web-app-1:8010/api/v1/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v2/docs {
        proxy_pass http://web-app-1:8010/api/v2/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi/v1.json {
        proxy_pass http://web-app-1:8010/openapi/v1.json;
        proxy_set_header Host $host;
    }
    location /openapi/v2.json {
        proxy_pass http://web-app-1:8010/openapi/v2.json;
        proxy_set_header Host $host;
    }

    # Документация (README.md)
    location /documentation {
        alias /var/www/docs;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # Для доступа к README.md
    location /docs/README.md {
        alias /var/www/docs/README.md;
        default_type text/markdown;
    }

    # Для картинок документации
    location /documentation/img/ {
        alias /var/www/docs/img/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /img/ {
        alias /var/www/docs/img/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        proxy_pass http://web-app-1:8010/health;
        proxy_set_header Host $host;
    }


    location /status {
        stub_status on;
        access_log off;
        allow all;
    }

    location /management/ {
        alias /var/www/management/;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # Зарезервированная область
    location /reserved/ {
        root /var/www/static;
        try_files $uri $uri/ /index.html;
    }
    location /admin/ {
        proxy_pass http://travelguide-pgadmin:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /admin;
        
        # Для корректной работы ссылок в pgAdmin
        proxy_redirect / /admin/;
        proxy_cookie_path / /admin/;
        
        # Переписываем HTML для корректных путей
        sub_filter_once off;
        sub_filter_types *;
        sub_filter 'href="/' 'href="/admin/';
        sub_filter 'src="/' 'src="/admin/';
        sub_filter 'action="/' 'action="/admin/';
        sub_filter "href='/" "href='/admin/";
        sub_filter "src='/" "src='/admin/";
    }
    
    location / {
        root /var/www/static;
        index index.html;
        try_files $uri $uri/ /index.html =404;
    }
}