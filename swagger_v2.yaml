openapi: 3.0.3
info:
  title: TravelGuide API
  description: API для помощи в путешествиях
  version: 2.0.0
servers:
  - url: http://localhost:8800/api/v2
    description: Development server

paths:
  # ==================== ГОРОДА ====================
  /api/v2/cities:
    post:
      summary: Создать новый город
      description: Создает новый город в системе
      operationId: create_city
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Название города
                  example: "Москва"
              required:
                - name
      responses:
        '201':
          description: Город успешно создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: "Москва"
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - cities

    get:
      summary: Получить все города
      description: Возвращает список всех городов
      operationId: get_all_cities
      responses:
        '200':
          description: Список городов получен успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
        '404':
          description: Города не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - cities

  /api/v2/cities/{city_id}:
    get:
      summary: Получить город по ID
      description: Возвращает информацию о конкретном городе
      operationId: get_city
      parameters:
        - name: city_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Информация о городе получена успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '404':
          description: Город не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - cities

    put:
      summary: Обновить город
      description: Обновляет информацию о городе
      operationId: update_city
      parameters:
        - name: city_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Санкт-Петербург"
              required:
                - name
      responses:
        '200':
          description: Город успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/City'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '404':
          description: Город не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - cities

    delete:
      summary: Удалить город
      description: Удаляет город по ID
      operationId: delete_city
      parameters:
        - name: city_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '204':
          description: Город успешно удалён
        '404':
          description: Город не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - cities
  
  # ==================== ПОЛЬЗОВАТЕЛИ ====================
  /api/v2/users:
    post:
      summary: Создать нового пользователя
      description: Создает нового пользователя в системе (администратор или обычный пользователь)
      operationId: create_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fio:
                  type: string
                  description: ФИО пользователя
                  example: "Иванов Иван Иванович"
                number_passport:
                  type: string
                  description: Номер паспорта
                  example: "1234 567890"
                phone_number:
                  type: string
                  description: Номер телефона
                  example: "+7 999 123-45-67"
                email:
                  type: string
                  format: email
                  description: Email адрес
                  example: "user@example.com"
                login:
                  type: string
                  description: Логин для входа
                  example: "ivanov"
                password:
                  type: string
                  format: password
                  description: Пароль
                  example: "securepassword123"
                is_admin:
                  type: boolean
                  description: Является ли пользователь администратором
                  example: false
              required:
                - fio
                - number_passport
                - phone_number
                - email
                - login
                - password
                - is_admin
      responses:
        '201':
          description: Пользователь успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - users

    get:
      summary: Получить всех пользователей
      description: Возвращает список всех пользователей системы
      operationId: get_all_users
      responses:
        '200':
          description: Список пользователей успешно получен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '404':
          description: Пользователи не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - users

  /api/v2/users/{user_id}:
    get:
      summary: Получить пользователя по ID
      description: Возвращает информацию о конкретном пользователе
      operationId: get_user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Информация о пользователе успешно получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - users

    put:
      summary: Обновить данные пользователя
      description: Обновляет информацию о пользователе (включая статус администратора)
      operationId: update_user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fio:
                  type: string
                  example: "Иванов Иван Иванович"
                number_passport:
                  type: string
                  example: "1234 567890"
                phone_number:
                  type: string
                  example: "+7 999 123-45-67"
                email:
                  type: string
                  format: email
                  example: "ivanov@example.com"
                is_admin:
                  type: boolean
                  example: true
      responses:
        '200':
          description: Данные пользователя успешно обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - users

    delete:
      summary: Удалить пользователя
      description: Удаляет пользователя по ID
      operationId: delete_user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '204':
          description: Пользователь успешно удален
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - users
  
  # ==================== АУТЕНТИФИКАЦИЯ ====================
  /api/v2/login:
    post:
      summary: Login user
      description: Authenticate user and return JSON with access token
      operationId: login_user
      tags:
        - authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                  description: User login
                  example: "user123"
                password:
                  type: string
                  format: password
                  description: User password
                  example: "mypassword123"
              required:
                - login
                - password
      responses:
        '201':
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWT access token
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user_id:
                    type: integer
                    description: ID of authenticated user
                    example: 1
                  message:
                    type: string
                    description: Success message
                    example: "Login successful"
        '401':
          description: Invalid login or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidAcc'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

# ==================== ПРОЖИВАНИЕ ====================
  /api/v2/accommodations:
    post:
      summary: Создать новое размещение
      description: Создает новое размещение в системе
      operationId: create_accommodation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Название размещения
                  example: "Гостиница Россия"
                city_id:
                  type: integer
                  description: ID города
                  example: 1
                address:
                  type: string
                  description: Адрес размещения
                  example: "ул. Ленина, 10"
                price:
                  type: number
                  description: Стоимость проживания
                  example: 3500
                type:
                  type: string
                  description: Тип размещения
                  example: "Отель"
                rating:
                  type: integer
                  description: Рейтинг (1–5)
                  example: 4
                check_in:
                  type: string
                  format: date-time
                  example: "2025-06-15T14:00:00Z"
                check_out:
                  type: string
                  format: date-time
                  example: "2025-06-20T12:00:00Z"
              required:
                - name
                - city_id
                - address
                - price
                - type
                - check_in
                - check_out
      responses:
        '201':
          description: Размещение успешно создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accommodation'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - accommodations

    get:
      summary: Получить все размещения
      description: Возвращает список всех размещений
      operationId: get_all_accommodations
      responses:
        '200':
          description: Список размещений успешно получен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Accommodation'
        '404':
          description: Размещения не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - accommodations

  /api/v2/accommodations/{accommodation_id}:
    get:
      summary: Получить размещение по ID
      description: Возвращает информацию о конкретном размещении
      operationId: get_accommodation
      parameters:
        - name: accommodation_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Информация о размещении успешно получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accommodation'
        '404':
          description: Размещение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - accommodations

    put:
      summary: Обновить размещение
      description: Обновляет информацию о размещении
      operationId: update_accommodation
      parameters:
        - name: accommodation_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Отель Европа"
                city_id:
                  type: integer
                  example: 2
                address:
                  type: string
                  example: "Невский проспект, 5"
                price:
                  type: number
                  example: 4200
                type:
                  type: string
                  example: "Хостел"
                rating:
                  type: integer
                  example: 5
                check_in:
                  type: string
                  format: date-time
                  example: "2025-07-01T14:00:00Z"
                check_out:
                  type: string
                  format: date-time
                  example: "2025-07-10T12:00:00Z"
              required:
                - name
                - city_id
                - address
                - price
                - type
                - check_in
                - check_out
      responses:
        '200':
          description: Размещение успешно обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accommodation'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '404':
          description: Размещение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - accommodations

    delete:
      summary: Удалить размещение
      description: Удаляет размещение по ID
      operationId: delete_accommodation
      parameters:
        - name: accommodation_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '204':
          description: Размещение успешно удалено
        '404':
          description: Размещение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - accommodations

  /api/v2/travels/{travel_id}/accommodations/{accommodation_id}:
    post:
      summary: Добавить размещение к путешествию
      description: Создает новое размещение и добавляет его к указанному путешествию
      operationId: add_accommodation_to_travel
      tags:
        - travel-accommodations
      parameters:
        - name: route_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Название размещения
                  example: "Отель Москва"
                city_id:
                  type: integer
                  description: ID города
                  example: 1
                address:
                  type: string
                  description: Адрес размещения
                  example: "ул. Тверская, 15"
                price:
                  type: number
                  description: Стоимость проживания
                  example: 4200
                type:
                  type: string
                  description: Тип размещения
                  example: "Отель"
                rating:
                  type: integer
                  description: Рейтинг (1–5)
                  example: 5
                check_in:
                  type: string
                  format: date-time
                  description: Дата и время заезда
                  example: "2025-08-10T14:00:00Z"
                check_out:
                  type: string
                  format: date-time
                  description: Дата и время выезда
                  example: "2025-08-15T12:00:00Z"
              required:
                - name
                - city_id
                - address
                - price
                - type
                - check_in
                - check_out
      responses:
        '201':
          description: Размещение успешно добавлено к маршруту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accommodation'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '404':
          description: Маршрут не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

    delete:
      summary: Удалить размещение из путешествия
      description: Удаляет размещение из указанного путешествия
      operationId: delete_accommodation_from_travel
      tags:
        - travel-accommodations
      parameters:
        - name: travel_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
        - name: accommodation_id
          in: path
          required: true
          schema:
            type: integer
            example: 2
      responses:
        '204':
          description: Размещение успешно удалено из путешествия
        '404':
          description: Путешествие или размещение не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

# ==================== РАЗВЛЕЧЕНИЕ ====================
  /api/v2/entertainments:
    post:
      summary: Создать новое развлечение
      description: Создает новое развлечение в системе
      operationId: create_entertainment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                city_id:
                  type: integer
                  description: ID города, где проходит событие
                  example: 1
                event_name:
                  type: string
                  description: Название события
                  example: "Концерт"
                event_time:
                  type: string
                  format: date-time
                  description: Дата и время проведения
                  example: "2025-09-15T19:00:00Z"
                duration:
                  type: string
                  description: Продолжительность мероприятия
                  example: "2 часа"
                address:
                  type: string
                  description: Адрес проведения
                  example: "ул. Арбат, 20"
                description:
                  type: string
                  description: Краткое описание события
                  example: "Музыкальный концерт под открытым небом"
              required:
                - event_name
                - city_id
                - event_time
                - address
                - duration
      responses:
        '201':
          description: Развлечение успешно создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entertainment'
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - entertainments

    get:
      summary: Получить все развлечения
      description: Возвращает список всех развлечений
      operationId: get_all_entertainments
      responses:
        '200':
          description: Список развлечений успешно получен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entertainment'
        '404':
          description: Развлечения не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
      tags:
        - entertainments

