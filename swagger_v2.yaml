    get:
      summary: Получить все маршруты
      description: Возвращает список маршрутов, с возможностью фильтрации по типу
      operationId: get_all_routes
      tags:
        - routes
      parameters:
        - name: type
          in: query
          description: Фильтрация по типу маршрута
          required: false
          schema:
            type: string
            enum: ["Все", "Авторские", "Пользовательские"]
            example: custom
      responses:
        '200':
          description: Список маршрутов успешно получен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Route'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

  /api/v2/routes/{route_id}:
    get:
      summary: Получить маршрут по ID
      description: Возвращает информацию о конкретном маршруте, включая справочник и путешествие
      operationId: get_route
      tags:
        - routes
      parameters:
        - name: route_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Маршрут успешно получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '404':
          description: Маршрут не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

    put:
      summary: Обновить маршрут
      description: Обновляет существующий маршрут
      operationId: update_route
      tags:
        - routes
      parameters:
        - name: route_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                d_route_id:
                  type: integer
                  example: 1
                travel_id:
                  type: integer
                  example: 1
                start_time:
                  type: string
                  format: date-time
                  example: "2025-09-15T19:00:00Z"
                end_time:
                  type: string
                  format: date-time
                  example: "2025-09-15T19:00:00Z"
                type:
                  type: string
                  enum: [Авторские, Рекомендованные, Пользовательские]
      responses:
        '200':
          description: Маршрут успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route'
        '404':
          description: Маршрут не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'

    delete:
      summary: Удалить маршрут
      description: Удаляет маршрут по ID
      operationId: delete_route
      tags:
        - routes
      parameters:
        - name: route_id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        '204':
          description: Маршрут успешно удален
        '404':
          description: Маршрут не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  
components:
  schemas:
    City:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Москва"

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        fio:
          type: string
          example: "Иванов Иван Иванович"
        number_passport:
          type: string
          example: "1234 567890"
        phone_number:
          type: string
          example: "+7 999 123-45-67"
        email:
          type: string
          example: "user@example.com"
        login:
          type: string
          example: "ivanov"
        is_admin:
          type: boolean
          example: false

    Accommodation:
      type: object
      properties:
        accommodation_id:
          type: integer
          example: 1
        name:
          type: string
          example: "Гостиница Россия"
        address:
          type: string
          example: "ул. Ленина, 10"
        price:
          type: number
          example: 3500
        type:
          type: string
          example: "Отель"
        rating:
          type: integer
          example: 4
        check_in:
          type: string
          format: date-time
          example: "2025-06-15T14:00:00Z"
        check_out:
          type: string
          format: date-time
          example: "2025-06-20T12:00:00Z"
        city:
          $ref: '#/components/schemas/City'

    Entertainment:
      type: object
      properties:
        entertainment_id:
          type: integer
          example: 1
        duration:
          type: string
          example: "2 часа"
        address:
          type: string
          example: "ул. Арбат, 20"
        event_name:
          type: string
          example: "Концерт"
        event_time:
          type: string
          format: date-time
          example: "2025-09-15T19:00:00Z"
        city:
          $ref: '#/components/schemas/City'

    Travel:
      type: object
      properties:
        travel_id:
          type: integer
          example: 1
        status:
          type: string
          enum: ['В процессе', 'Завершен', 'Отменен']
          example: "В процессе"
        user_ids:
          type: array
          items:
            type: integer
        entertainment_ids:
          type: array
          items:
            type: integer
        accommodation_ids:
          type: array
          items:
            type: integer
      required:
        - travel_id
        - status
        - user_ids
        - entertainment_ids
        - accommodation_ids
    
    Route:
      type: object
      properties:
        route_id:
          type: integer
          example: 1
        d_route:
          type: integer
          example: 1
        travel:
          type: integer
          example: 1
        start_time:
          type: string
          format: date-time
          example: "2025-09-15T19:00:00Z"
        end_time:
          type: string
          format: date-time
          example: "2025-09-15T19:00:00Z"
        type:
          type: string
          enum: [Авторские, Пользовательские]
      required:
        - route_id
        - d_route
        - travel
        - start_time
        - end_time
        - type

    DirectoryRoute:
      type: object
      properties:
        d_route_id:
          type: integer
          example: 1
        type_transport:
          type: string
          example: "train"
        cost:
          type: integer
          example: 1500
        distance:
          type: integer
          example: 300
        departure_city:
          type: integer
          example: 1
        destination_city:
          type: integer
          example: 3
      required:
        - d_route_id
        - type_transport
        - cost
        - distance
        - departure_city
        - destination_city

    BadRequestError:
      type: object
      properties:
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Неверный запрос"
        status_code:
          type: integer
          example: 400
    
    InternalServerError:
      type: object
      properties:
        error:
          type: string
          example: "Internal Server Error"
        message:
          type: string
          example: "Внутренняя ошибка сервера"
        status_code:
          type: integer
          example: 500
    
    NotFoundError:
      type: object
      properties:
        error:
          type: string
          example: "Not Found"
        message:
          type: string
          example: "Объект не найден"
        status_code:
          type: integer
          example: 404
    
    InvalidAcc:
      type: object
      properties:
        error:
          type: string
          description: Код ошибки
          example: "invalid_credentials"
        message:
          type: string
          description: Сообщение об ошибке
          example: "Неверный логин или пароль"
        status:
          type: integer
          description: HTTP статус ошибки
          example: 401 

tags:
  - name: cities
    description: Операции с городами
  - name: users
    description: Операции с пользователями
  - name: authentication
    description: Аутентификация
  - name: accommodations
    description: Операции с местом жительства
  - name: entertainments
    description: Операции с развлечением
  - name: travels
    description: Операции с развлечением
  - name: routes
    description: Операции с маршрутами
  - name: directory-routes
    description: Операции со справочниками маршрутами