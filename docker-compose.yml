  # === Postgres master ===
  db-master:
    image: postgres:15
    container_name: postgres_master
    user: postgres
    environment:
      POSTGRES_USER: write_user
      POSTGRES_PASSWORD: write_password
      POSTGRES_DB: mydb
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d 
      - ./db-init/pg_hba.conf:/etc/postgresql/pg_hba.conf
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - wal_keep_size=64
      - -c
      - listen_addresses=*
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U write_user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - web_my_network
    deploy:
      restart_policy:
        condition: on-failure

  # === Postgres slave ===
  db-slave:
    image: postgres:15
    # container_name: web-db-slave
    depends_on:
      db-master:
        condition: service_healthy
    environment:
      POSTGRES_USER: write_user
      POSTGRES_PASSWORD: write_password
      POSTGRES_DB: mydb
    volumes:
      - postgres_slave_data_1:/var/lib/postgresql/data
      - postgres_slave_data_2:/var/lib/postgresql/data
    command: >
      bash -c "
      if [ ! -s '/var/lib/postgresql/data/PG_VERSION' ]; then
        echo 'Initializing replication from master...';
        until pg_isready -h db-master -U replica_user; do
          echo 'Waiting for master to be ready...';
          sleep 2;
        done;
        rm -rf /var/lib/postgresql/data/*;
        PGPASSWORD=replica_password pg_basebackup -h db-master -D /var/lib/postgresql/data -U replica_user -Fp -Xs -P -R;
        chown -R postgres:postgres /var/lib/postgresql/data;
        chmod 700 /var/lib/postgresql/data;
      else
        echo 'Slave data already initialized. Skipping base backup.';
      fi;
      exec docker-entrypoint.sh postgres
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U write_user -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - web_my_network
    deploy:
      replicas: 1

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    restart: unless-stopped
    networks:
      - web_my_network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # === pgAdmin ===
  pgadmin:
    image: dpage/pgadmin4
    container_name: travelguide-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@travelguide.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db-master
    networks:
      - web_my_network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    # === Nginx ===
  nginx:
    image: openresty/openresty:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./static:/var/www/static
      - ./docs:/var/www/docs
      - ./management:/var/www/management
      - ./nginx/logs:/var/log/nginx    
    # depends_on:
      # - app_main
      # - app_read1
      # - app_read2
    networks:
      - web_my_network
    deploy:
      replicas: 1


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"     # основной порт для сообщений
      - "15672:15672"   # порт для управления
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: pass
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - web_my_network

  # grafana:
  #   image: grafana/grafana
  #   container_name: travelguide-grafana
  #   environment:
  #     GF_SECURITY_ADMIN_USER: admin
  #     GF_SECURITY_ADMIN_PASSWORD: admin
