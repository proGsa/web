services:
  # === Core Service ===
  core_service:
    build: 
      context: .
      dockerfile: Dockerfile_core
    
    # container_name: core_service
    environment:
      APP_MODULE: core_service.main
      APP_PORT: 8000
      NODE_NAME: core_service
      RABBIT_URL: amqp://user:pass@rabbitmq:5672/
    depends_on:
      - rabbitmq
      - data_service
    # ports:
    #   - "8000:8000"
    volumes:
      - ./logs/core_service:/app/logs/core_service 
    networks:
      - web_my_network
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure


  # === Data Service ===
  data_service:
    build: 
      context: .
      dockerfile: Dockerfile_data
    # container_name: data_service
    environment:
      APP_MODULE: data_service.main
      APP_PORT: 8001
      NODE_NAME: data_service
      RABBIT_URL: amqp://user:pass@rabbitmq:5672/

      # Postgres
      DB_MODE: write                  # или read, если нужен read-replica
      DB_USER: write_user
      DB_PASSWORD: write_password
      DB_NAME: mydb
      DB_HOST: db-master              # для read: db-slave
      DB_PORT: 5432

      # MONGO_URI: mongodb://admin:password@mongodb:27017
    depends_on:
      - rabbitmq
      - db-master
      - db-slave
      # - mongodb
    # ports:
    #   - "8001:8001"
    volumes:
      - ./logs/data_service:/app/logs/data_service 
    networks:
      - web_my_network
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure


  # === Gateway ===
  gateway-3:
    build: 
      context: .
      dockerfile: Dockerfile_gateway
    container_name: gateway-3 
    # container_name: gateway_main
    environment:
      APP_MODULE: gateway.main
      APP_PORT: 8010
      NODE_NAME: gateway_main
      RABBIT_URL: amqp://user:pass@rabbitmq:5672/
    depends_on:
      - rabbitmq
      - core_service
      - data_service
    volumes:
      - ./logs/gateway:/app/logs/gateway
    networks:
      - web_my_network

  gateway:
    build: 
      context: .
      dockerfile: Dockerfile_gateway
    # container_name: gateway_read1
    environment:
      APP_MODULE: gateway.main
      APP_PORT: 8010
      NODE_NAME: gateway_read1
      RABBIT_URL: amqp://user:pass@rabbitmq:5672/
    depends_on:
      - rabbitmq
      - core_service
      - data_service
    volumes:
      - ./logs/gateway:/app/logs/gateway
    networks:
      - web_my_network
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure


